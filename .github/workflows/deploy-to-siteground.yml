name: Deploy to SiteGround

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds one page per event from template.html + events.json
      - name: Build event pages
        run: node build.js

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./
          server-dir: /public_html/funnel/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            template.html
            events.json
            build.js
            README.md
